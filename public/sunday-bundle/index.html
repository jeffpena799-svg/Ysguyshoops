<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y's Guys Sunday Bundle</title><style>:root{--navy:#052f61;--gold:#bd850a;--cream:#faf8ef}*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif;color:#172033}.shell{max-width:1500px;margin:auto;padding:10px}.bar,.editor{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 12px #0001}.bar{position:sticky;top:0;z-index:20;margin-bottom:10px}.bar h2{margin:0 0 6px;font-size:18px}.bar p,.msg{margin:0 0 8px;color:#667085;font-size:12px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:0;border-radius:8px;padding:10px;font-weight:700;background:var(--navy);color:#fff}.secondary{background:#dfe5eb;color:#172033}.workspace{display:grid;grid-template-columns:320px 1fr;gap:12px}.editor label{display:block;font-size:12px;font-weight:800;margin:8px 0 3px}input,textarea{width:100%;padding:8px;border:1px solid #cbd3da;border-radius:6px;font:inherit}textarea{height:310px;font:12px ui-monospace,monospace}.preview{overflow:auto}.card{position:relative;width:1448px;height:1086px;background:#faf8ef url('data:image/webp;base64,UklGRh4AAABXRUJQVlA4IBIAAABQAwCdASpYBEAAPm0skkYkIqGYBABABsSxAE6ZQ7Zf8f4AA==') center/cover no-repeat;overflow:hidden}.cover{position:absolute;background:#faf8ef}.meta-cover{left:222px;top:155px;width:1042px;height:45px}.table-cover{left:31px;top:258px;width:1008px;height:703px}.leaders-cover{left:1057px;top:255px;width:354px;height:725px}.meta{position:absolute;left:230px;top:158px;width:1030px;height:40px;display:flex;align-items:center;justify-content:space-around;color:#0b2670;font-weight:900;font-size:24px;letter-spacing:1px}.meta span+span:before{content:'|';margin-right:36px;color:#152778}.grid{position:absolute;left:31px;top:258px;width:1008px;border-left:1px solid #9aa9b2;border-top:1px solid #9aa9b2}.row{height:58px;display:grid;grid-template-columns:158px 116px 116px 124px 122px 122px 122px 128px;border-bottom:1px solid #9aa9b2}.cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #9aa9b2;color:#10257b;font-size:25px;font-weight:800}.cell:first-child{justify-content:flex-start;padding-left:20px}.leaders{position:absolute;left:1058px;top:258px;width:352px}.leader{height:144px;position:relative;border-bottom:2px solid #8194a4}.leader:last-child{border-bottom:0}.circle{position:absolute;left:18px;top:20px;width:92px;height:92px;border:2px solid #12307b;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#062f60;font:900 56px Georgia;transform:rotate(-10deg)}.leaderText{position:absolute;left:120px;right:5px;top:11px;text-align:center;color:#10257b;font-weight:900}.leaderText b{display:block;font-size:18px}.leaderText strong{display:block;color:#bd850a;font-size:55px;line-height:1}.leaderText span{display:block;font-size:21px}.hint{margin-top:8px}@media(max-width:1000px){.shell{padding:8px}.bar h2{font-size:16px}.buttons{grid-template-columns:1fr 1fr}.workspace{display:flex;flex-direction:column}.preview{order:1;width:100%;overflow:hidden}.editor{order:2}.card{transform-origin:top left;transform:scale(var(--s,.25));margin-bottom:calc(-1086px*(1 - var(--s,.25)))}textarea{height:220px}}</style></head><body><div class="shell"><div class="bar"><h2>Y's Guys Sunday Bundle — Daily Totals Master</h2><p>Approved artwork is now the locked visual reference. Data remains dynamic.</p><div class="buttons"><button onclick="applyData()">Update Graphic</button><button onclick="saveImage()">Save / Share Image</button><button class="secondary" onclick="clearStats()">Clear Stats</button></div><div id="status" class="msg">Ready.</div></div><div class="workspace"><section class="editor"><label>Season</label><input id="season" value="2"><label>Week</label><input id="week" value="11"><label>Date</label><input id="date" value="SEPTEMBER 27, 2026"><label>Day</label><input id="day" value="SUNDAY"><label>Player data</label><textarea id="data">Paul,11,6-5,45,31,10,1,4

const MASTER='data:image/webp;base64,UklGRh4AAABXRUJQVlA4IBIAAABQAwCdASpYBEAAPm0skkYkIqGYBABABsSxAE6ZQ7Zf8f4AA==';
function parse(){return data.value.trim().split(/\n+/).filter(Boolean).map(line=>{const p=line.split(',').map(x=>x.trim());if(p.length<8)throw new Error('Each row needs 8 fields');return{player:p[0],gp:+p[1],wl:p[2],pts:+p[3],reb:+p[4],ast:+p[5],to:+p[6],stocks:+p[7]}})}function sortRows(a){return[...a].sort((x,y)=>(y.gp-x.gp)||x.player.localeCompare(y.player,undefined,{sensitivity:'base'}))}function best(a,k,low=false){return[...a].sort((x,y)=>low?x[k]-y[k]:y[k]-x[k])[0]}function applyData(){try{const raw=parse(),rows=sortRows(raw);meta.innerHTML=`<span>▣ &nbsp; SEASON ${season.value}</span><span>WEEK ${week.value}</span><span>${date.value.toUpperCase()}</span><span>${day.value.toUpperCase()}</span>`;grid.innerHTML=rows.map(r=>`<div class="row"><div class="cell">${r.player}</div><div class="cell">${r.gp}</div><div class="cell">${r.wl}</div><div class="cell">${r.pts}</div><div class="cell">${r.reb}</div><div class="cell">${r.ast}</div><div class="cell">${r.to}</div><div class="cell">${r.stocks}</div></div>`).join('');const L=[['POINTS',best(raw,'pts'),'pts'],['REBOUNDS',best(raw,'reb'),'reb'],['ASSISTS',best(raw,'ast'),'ast'],['STEALS + BLOCKS',best(raw,'stocks'),'stocks'],['LOWEST TURNOVERS',best(raw,'to',true),'to']];leaders.innerHTML=L.map(([label,r,k])=>`<div class="leader"><div class="circle">Y</div><div class="leaderText"><b>${label}</b><strong>${r[k]}</strong><span>${r.player.toUpperCase()}</span></div></div>`).join('');status.textContent='Updated — master artwork locked; sorted by GP, then alphabetically.';return rows}catch(e){status.textContent='Error: '+e.message;throw e}}function clearStats(){data.value='';grid.innerHTML='';leaders.innerHTML='';status.textContent='Stats cleared.'}function fit(){if(innerWidth<=1000){const w=document.querySelector('.preview').clientWidth;card.style.setProperty('--s',Math.min(w/1448,.48))}else card.style.removeProperty('--s')}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}function makeSVG(rows){const raw=parse(),B=(k,l=false)=>[...raw].sort((a,b)=>l?a[k]-b[k]:b[k]-a[k])[0]||{},L=[['POINTS',B('pts'),'pts'],['REBOUNDS',B('reb'),'reb'],['ASSISTS',B('ast'),'ast'],['STEALS + BLOCKS',B('stocks'),'stocks'],['LOWEST TURNOVERS',B('to',true),'to']];const rr=rows.map((r,i)=>{let y=258+i*58+37,x=[51,245,361,481,604,726,848,976],v=[r.player,r.gp,r.wl,r.pts,r.reb,r.ast,r.to,r.stocks];return v.map((z,j)=>`<text x="${x[j]}" y="${y}" font-family="Arial" font-size="25" font-weight="800" fill="#10257b" text-anchor="${j?'middle':'start'}">${esc(z)}</text>`).join('')}).join('');const ls=L.map(([label,r,k],i)=>{let y=258+i*144;return `<circle cx="1122" cy="${y+66}" r="46" fill="#faf8ef" stroke="#12307b" stroke-width="2"/><text x="1122" y="${y+82}" text-anchor="middle" font-family="Georgia" font-size="56" font-weight="900" fill="#062f60">Y</text><text x="1280" y="${y+31}" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#10257b">${label}</text><text x="1280" y="${y+88}" text-anchor="middle" font-family="Arial" font-size="55" font-weight="900" fill="#bd850a">${esc(r[k])}</text><text x="1280" y="${y+116}" text-anchor="middle" font-family="Arial" font-size="21" font-weight="900" fill="#10257b">${esc(String(r.player||'').toUpperCase())}</text>`}).join('');return `<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086"><image href="${MASTER}" width="1448" height="1086"/><rect x="222" y="155" width="1042" height="45" fill="#faf8ef"/><rect x="31" y="258" width="1008" height="703" fill="#faf8ef"/><rect x="1057" y="255" width="354" height="725" fill="#faf8ef"/><g font-family="Arial" font-size="24" font-weight="900" fill="#0b2670"><text x="260" y="187">▣  SEASON ${esc(season.value)}</text><text x="510" y="187">|  WEEK ${esc(week.value)}</text><text x="700" y="187">|  ${esc(date.value.toUpperCase())}</text><text x="1080" y="187">|  ${esc(day.value.toUpperCase())}</text></g><g>${rr}</g><g>${ls}</g></svg>`}async function saveImage(){try{const rows=applyData(),svg=makeSVG(rows),file=new File([svg],`ys-guys-daily-stats-week-${week.value}.svg`,{type:'image/svg+xml'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){status.textContent='Opening iPhone share sheet…';await navigator.share({files:[file],title:"Y's Guys Daily Stats"});status.textContent='Image ready — use Save to Files.';return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='Image file created. Check Downloads.'}catch(e){status.textContent=e.name==='AbortError'?'Share canceled.':'Save failed: '+e.message}}addEventListener('resize',fit);applyData();fit();</script></body></html>
