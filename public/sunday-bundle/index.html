<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y's Guys Sunday Bundle Prototype</title><style>:root{--n:#07305c;--b:#1d2d77;--g:#bd850a;--c:#faf8ef;--grid:#9eacb5}*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif;color:#172033}.shell{max-width:1500px;margin:auto;padding:10px}.bar,.editor{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 12px #0001}.bar{position:sticky;top:0;z-index:20;margin-bottom:10px}.bar h2{margin:0 0 6px;font-size:18px}.bar p{margin:0 0 8px;color:#667085;font-size:13px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:0;border-radius:8px;padding:10px;font-weight:700;background:var(--n);color:#fff}.secondary{background:#dfe5eb;color:#172033}.workspace{display:grid;grid-template-columns:320px 1fr;gap:12px}.editor label{display:block;font-size:12px;font-weight:800;margin:8px 0 3px}input,textarea{width:100%;padding:8px;border:1px solid #cbd3da;border-radius:6px;font:inherit}textarea{height:310px;font:12px ui-monospace,monospace}.preview{overflow:auto}.card{position:relative;width:1408px;height:1056px;background:var(--c);color:var(--b);border:3px solid var(--g);padding:24px 28px 20px;overflow:hidden}.card:before{content:"";position:absolute;inset:9px;border:1px solid var(--g)}header{height:126px;display:flex;align-items:center;justify-content:center;gap:36px}.mark{font:900 88px Georgia;color:var(--n)}h1{font:700 72px Georgia;color:var(--n);letter-spacing:3px;margin:0}.rule{height:1px;background:#b9c3c9;margin:0 165px}.meta{height:58px;display:flex;align-items:center;justify-content:center;gap:24px;font-weight:900;font-size:23px}.meta i{height:31px;width:2px;background:var(--b)}main{display:grid;grid-template-columns:984px 354px;gap:14px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:24px}th{height:47px;background:var(--n);color:var(--g);font-size:20px}td{height:55px;border:1px solid var(--grid);text-align:center;font-weight:800}td:first-child{text-align:left;padding-left:20px}th:first-child{width:158px}th:last-child{width:136px}aside{border:2px solid var(--n);border-radius:12px;overflow:hidden}.ltitle{height:46px;background:var(--n);color:var(--g);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}.leader{height:132px;margin:0 12px;border-bottom:2px solid #aab7c0;display:grid;grid-template-columns:105px 1fr;align-items:center}.leader:last-child{border-bottom:0}.lmark{width:78px;height:78px;border:2px solid var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 46px Georgia;color:var(--n)}.leader>div:last-child{text-align:center}.leader b,.leader span{display:block;font-size:17px}.leader strong{display:block;color:var(--g);font-size:50px;line-height:1.05}.leader span{font-weight:900;font-size:20px}footer{height:48px;display:flex;align-items:end;justify-content:center;font:800 16px Georgia}.msg{font-size:12px;color:#667085;margin-top:6px}@media(max-width:1000px){.shell{padding:8px}.bar h2{font-size:16px}.buttons{grid-template-columns:1fr 1fr}.workspace{display:flex;flex-direction:column}.preview{order:1;width:100%;overflow:hidden}.editor{order:2}.card{transform-origin:top left;transform:scale(var(--s,.25));margin-bottom:calc(-1056px*(1 - var(--s,.25)))}textarea{height:220px}}</style></head><body><div class="shell"><div class="bar"><h2>Y's Guys Sunday Bundle — Standalone Prototype</h2><p>Daily Totals sandbox. Separate from the live league app.</p><div class="buttons"><button onclick="applyData()">Update Graphic</button><button onclick="saveImage()">Save / Share Image</button><button class="secondary" onclick="clearStats()">Clear Stats</button></div><div id="status" class="msg">Ready.</div></div><div class="workspace"><section class="editor"><label>Season</label><input id="season" value="2"><label>Week</label><input id="week" value="11"><label>Date</label><input id="date" value="SEPTEMBER 27, 2026"><label>Day</label><input id="day" value="SUNDAY"><label>Player data</label><textarea id="data">Paul,11,6-5,45,31,10,1,4

function parse(){return data.value.trim().split(/\n+/).filter(Boolean).map(line=>{const p=line.split(',').map(x=>x.trim());if(p.length<8)throw new Error('Each row needs 8 fields');return{player:p[0],gp:+p[1],wl:p[2],pts:+p[3],reb:+p[4],ast:+p[5],to:+p[6],stocks:+p[7]}})}function sortRows(a){return[...a].sort((x,y)=>(y.gp-x.gp)||x.player.localeCompare(y.player,undefined,{sensitivity:'base'}))}function best(a,k,low=false){return[...a].sort((x,y)=>low?x[k]-y[k]:y[k]-x[k])[0]}function applyData(){try{const raw=parse(),a=sortRows(raw);mseason.textContent='SEASON '+season.value;mweek.textContent='WEEK '+week.value;mdate.textContent=date.value.toUpperCase();mday.textContent=day.value.toUpperCase();tbody.innerHTML=a.map(r=>`<tr><td>${r.player}</td><td>${r.gp}</td><td>${r.wl}</td><td>${r.pts}</td><td>${r.reb}</td><td>${r.ast}</td><td>${r.to}</td><td>${r.stocks}</td></tr>`).join('');const L=[['POINTS',best(raw,'pts'),'pts'],['REBOUNDS',best(raw,'reb'),'reb'],['ASSISTS',best(raw,'ast'),'ast'],['STEALS + BLOCKS',best(raw,'stocks'),'stocks'],['LOWEST TURNOVERS',best(raw,'to',true),'to']];leaders.innerHTML=L.map(([label,r,k])=>`<div class="leader"><div class="lmark">Y</div><div><b>${label}</b><strong>${r[k]}</strong><span>${r.player.toUpperCase()}</span></div></div>`).join('');status.textContent='Updated — sorted by GP, then alphabetically.';return a}catch(e){status.textContent='Error: '+e.message;throw e}}function clearStats(){data.value='';tbody.innerHTML='';leaders.innerHTML='';status.textContent='Stats cleared.'}function fit(){if(innerWidth<=1000){const w=document.querySelector('.preview').clientWidth;card.style.setProperty('--s',Math.min(w/1408,.48))}else card.style.removeProperty('--s')}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}function makeSVG(rows){const navy='#07305c',blue='#1d2d77',gold='#bd850a',cream='#faf8ef',grid='#9eacb5';const B=(k,l=false)=>[...rows].sort((a,b)=>l?a[k]-b[k]:b[k]-a[k])[0]||{};const L=[['POINTS',B('pts'),'pts'],['REBOUNDS',B('reb'),'reb'],['ASSISTS',B('ast'),'ast'],['STEALS + BLOCKS',B('stocks'),'stocks'],['LOWEST TURNOVERS',B('to',true),'to']];const trs=rows.map((r,i)=>{const y=253+i*55,v=[r.player,r.gp,r.wl,r.pts,r.reb,r.ast,r.to,r.stocks],x=[48,244,356,472,588,703,818,938];return `<g>${v.map((z,j)=>`<text x="${x[j]}" y="${y+35}" font-family="Arial" font-size="24" font-weight="700" fill="${blue}" text-anchor="${j?'middle':'start'}">${esc(z)}</text>`).join('')}<line x1="28" y1="${y+54}" x2="1012" y2="${y+54}" stroke="${grid}"/></g>`}).join('');const ls=L.map(([label,r,k],i)=>{const y=265+i*132;return `<g><circle cx="1082" cy="${y+61}" r="39" fill="none" stroke="${blue}" stroke-width="2"/><text x="1082" y="${y+78}" text-anchor="middle" font-family="Georgia" font-size="46" font-weight="900" fill="${navy}">Y</text><text x="1250" y="${y+25}" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="${blue}">${label}</text><text x="1250" y="${y+76}" text-anchor="middle" font-family="Arial" font-size="50" font-weight="900" fill="${gold}">${esc(r[k]??'')}</text><text x="1250" y="${y+105}" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="${blue}">${esc(String(r.player||'').toUpperCase())}</text></g>`}).join('');return `<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="1056" viewBox="0 0 1408 1056"><rect width="1408" height="1056" fill="${cream}"/><rect x="3" y="3" width="1402" height="1050" fill="none" stroke="${gold}" stroke-width="3"/><rect x="12" y="12" width="1384" height="1032" fill="none" stroke="${gold}"/><text x="210" y="112" font-family="Georgia" font-size="88" font-weight="900" fill="${navy}">Y</text><text x="704" y="108" text-anchor="middle" font-family="Georgia" font-size="72" font-weight="700" fill="${navy}">DAILY STATS</text><line x1="193" y1="150" x2="1215" y2="150" stroke="#b9c3c9"/><g font-family="Arial" font-size="23" font-weight="900" fill="${blue}"><text x="300" y="190">SEASON ${esc(season.value)}</text><text x="520" y="190">WEEK ${esc(week.value)}</text><text x="700" y="190">${esc(date.value.toUpperCase())}</text><text x="1110" y="190">${esc(day.value.toUpperCase())}</text></g><rect x="28" y="206" width="984" height="47" fill="${navy}"/><g font-family="Arial" font-size="20" font-weight="900" fill="${gold}" text-anchor="middle"><text x="107" y="237">PLAYER</text><text x="244" y="237">GP</text><text x="356" y="237">W-L</text><text x="472" y="237">PTS</text><text x="588" y="237">REB</text><text x="703" y="237">AST</text><text x="818" y="237">TO</text><text x="944" y="237">STL+BLK</text></g>${trs}<rect x="1026" y="206" width="354" height="707" rx="12" fill="none" stroke="${navy}" stroke-width="2"/><rect x="1026" y="206" width="354" height="47" rx="12" fill="${navy}"/><text x="1203" y="237" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="${gold}">★ TOP PLAYERS ★</text>${ls}<text x="704" y="1022" text-anchor="middle" font-family="Georgia" font-size="16" font-weight="800" fill="${blue}">Y’S GUYS OFFICIAL STATISTICAL REPORT</text></svg>`}async function saveImage(){try{const rows=applyData(),svg=makeSVG(rows),file=new File([svg],`ys-guys-daily-stats-week-${week.value}.svg`,{type:'image/svg+xml'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){status.textContent='Opening iPhone share sheet…';await navigator.share({files:[file],title:"Y's Guys Daily Stats"});status.textContent='Image ready — use Save to Files in the share sheet.';return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='Image file created. Check Downloads.'}catch(e){if(e.name==='AbortError'){status.textContent='Share canceled.'}else status.textContent='Save failed: '+e.message}}addEventListener('resize',fit);applyData();fit();</script></body></html>
