name: Build release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package deployment source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf ys-guys-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: ys-guys-source
          path: ys-guys-source.tgz
          retention-days: 3
