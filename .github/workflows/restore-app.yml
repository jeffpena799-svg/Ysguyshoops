name: Restore App Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore App.tsx after accidental overwrite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx from last known good source
        run: |
          git show 3c76e8620ee44f69b7b1c15ee134a0ee1c2a99b0:src/App.tsx > src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No restore needed"
          else
            git commit -m "Restore App.tsx after accidental overwrite"
            git push
          fi
