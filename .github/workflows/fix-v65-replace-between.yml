name: Fix Version 6.5 replacement boundaries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('version65.plugin.ts')
          source = path.read_text()
          old = 'return source.slice(0,from)+replacement+source.slice(to);'
          new = 'return source.slice(0,from)+replacement+source.slice(to+end.length);'
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Expected Version 6.5 replacement helper was not found')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version65.plugin.ts
          git commit -m "Fix Version 6.5 source replacement boundaries"
          git push
