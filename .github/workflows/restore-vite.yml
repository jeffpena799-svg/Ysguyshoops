name: Restore Vite Close Sunday Config

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore Vite config for Close Sunday'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Vite config
        run: |
          git show 3c76e8620ee44f69b7b1c15ee134a0ee1c2a99b0:vite.config.ts > vite.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts
          if git diff --cached --quiet; then
            echo "No restore needed"
          else
            git commit -m "Restore Vite config for Close Sunday"
            git push
          fi
